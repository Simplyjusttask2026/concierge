name: Render health check - failures are visible
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTP health without hiding failure
        run: |
          curl --fail --silent --show-error --max-time 60 https://sjt-concierge.onrender.com/ping
          echo 'Health only; cron timing and free-host uptime are not guaranteed.' >> "$GITHUB_STEP_SUMMARY"
