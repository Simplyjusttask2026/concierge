name: Keep Render Awake

on:
  schedule:
    # Every 10 minutes (GitHub Actions free tier; may be delayed under load)
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping concierge
        run: |
          curl -fsS --max-time 60 https://sjt-concierge.onrender.com/ping || echo "ping failed (Render may be waking)"
