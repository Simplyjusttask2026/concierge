name: BRAIN Convo 8 Apply - manual only
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  brain8:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply BRAIN convo 8 patch
        run: python scripts/brain_convo8_patch.py
      - name: Commit BRAIN convo 8 back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BRAIN.md
          if git diff --cached --quiet; then
            echo "No changes to commit (already at convo 8)."
          else
            git commit -m "BRAIN convo 8: WhatsApp + Nextdoor Kernel corrections + full audit"
            git push origin main
          fi
