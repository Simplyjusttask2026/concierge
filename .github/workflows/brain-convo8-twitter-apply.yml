name: BRAIN Twitter Addendum Apply - manual only
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/brain_convo8_twitter_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BRAIN.md
          if git diff --cached --quiet; then
            echo "No changes (already in BRAIN)."
          else
            git commit -m "BRAIN convo 8 addendum: Twitter/X removed"
            git push origin main
          fi
