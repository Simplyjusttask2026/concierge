name: CrewAI hunt - PAUSED after monthly allowance exhausted
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: No execution, retry, or upgrade
        run: |
          echo '::error::CrewAI free monthly allowance exhausted. Verify free allowance before changing this pause.'
          exit 1
