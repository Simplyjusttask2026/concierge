name: CrewAI hunt PAUSED - monthly free allowance exhausted
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  quota_notice:
    runs-on: ubuntu-latest
    steps:
      - name: Stop without consuming executions or upgrading
        run: |
          echo '::error::CrewAI reached its monthly execution limit. No retry, extra account, quota bypass or paid upgrade. Reassess available free allowance separately.'
          exit 1
