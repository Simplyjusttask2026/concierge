name: Apply tested Zoho routing repair - branch only
on:
  push:
    branches: [fix/frankenstein-tested-a6d401]
    paths: [scripts/apply_zoho_route_repair.py,zoho_route_policy.py,.github/workflows/apply-zoho-route-repair.yml]
permissions:
  contents: write
jobs:
  patch-and-test:
    if: github.ref == 'refs/heads/fix/frankenstein-tested-a6d401'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch exact reviewed source
        run: python scripts/apply_zoho_route_repair.py
      - name: Offline regressions only
        run: python -m unittest discover -s tests -v
      - run: node --check widget.js
      - name: Save branch repair only
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/frankenstein-tested-a6d401'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add concierge.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use working Zoho bridge during invalid direct auth cooldown; never replay uncertain writes'
          git push origin HEAD:fix/frankenstein-tested-a6d401
