name: BRAIN Convo 13 Apply - manual only
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  brain13:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply BRAIN convo 13 patch
        run: python scripts/brain_convo13_patch.py
      - name: Commit BRAIN convo 13 back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BRAIN.md
          if git diff --cached --quiet; then
            echo "No changes to commit (already at convo 13)."
          else
            git commit -m "BRAIN convo 13: full read, merge 8 notes + pasted convo, read again"
            git push origin main
          fi
