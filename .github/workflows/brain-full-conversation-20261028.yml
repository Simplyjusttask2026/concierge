name: BRAIN full Dell conversation 2026-10-28 - manual only
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: brain-append-only
  cancel-in-progress: false
jobs:
  append-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve all old bytes and append complete owner-authorized transcript
        run: python scripts/append_brain_20261028_full_conversation.py
      - name: Commit only BRAIN.md, no pipelines or outreach
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- BRAIN.md
          if git diff --cached --quiet; then
            echo 'Transcript already present; no commit needed'
          else
            git commit -m 'BRAIN: append entire Dell concierge conversation 2026-10-28'
            git push origin HEAD:main
          fi
