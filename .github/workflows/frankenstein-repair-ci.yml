name: Frankenstein repair regression - no live accounts
on:
  push:
    branches: [fix/frankenstein-reliability-20261028]
    paths-ignore: [.github/workflows/frankenstein-repair-verified.yml]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests flask pyyaml
      - name: Offline regressions and syntax
        run: |
          python -m unittest discover -s tests -v
          node --check widget.js
          python - <<'PY'
          import ast, pathlib, yaml
          for p in ('concierge.py','reliability.py','sjt_reliability.py','sjt_web_jobs.py','scripts/daily_job.py','scripts/operations_runner.py'):
              ast.parse(pathlib.Path(p).read_text())
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(p.read_text())
          PY
