name: Frankenstein tested repair - offline regression
on:
  push:
    branches: [fix/frankenstein-tested-a6d401]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Mocked regression tests - no connected accounts
        run: python -m unittest discover -s tests -v
      - name: Source syntax
        run: |
          node --check widget.js
          python - <<'PY'
          import ast,pathlib
          for path in ('concierge.py','reliability.py','scripts/daily_job.py','scripts/operations_runner.py'):
              ast.parse(pathlib.Path(path).read_text())
          PY
