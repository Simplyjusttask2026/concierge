name: BRAIN append Python booking conversation - manual only
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: brain-memory-append
  cancel-in-progress: false
jobs:
  append-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append memory without altering existing bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('BRAIN.md')
          before = p.read_bytes()
          note = Path('BRAIN_UPDATES/2026-10-28-python-booking-zoho-conversation.md').read_bytes()
          marker = b'<!-- BEGIN SJT BRAIN APPEND 2026-10-28 PYTHON BOOKING ZOHO -->'
          if marker in before:
              assert before.count(marker) == 1
              assert note in before
              print('Already appended exactly once')
          else:
              after = before + note
              assert after[:len(before)] == before
              assert after.count(marker) == 1
              p.write_bytes(after)
              assert p.read_bytes() == after
              print('Preserved prefix bytes:', len(before), 'sha256:', hashlib.sha256(before).hexdigest())
              print('Appended bytes:', len(note), 'sha256:', hashlib.sha256(note).hexdigest())
          PY
      - name: Commit memory only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add BRAIN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'BRAIN: append full pasted Python booking Zoho conversation; preserve history'
          git push origin HEAD:main
