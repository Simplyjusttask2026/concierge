name: Add Twitter - manual only
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-add Twitter to social platforms
        run: python scripts/add_twitter_patch.py
      - name: Commit back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concierge.py
          if git diff --cached --quiet; then
            echo "No changes to commit (already re-added)."
          else
            git commit -m "Re-add Twitter/X to social: @simplyjusttask connected in Composio"
            git push origin main
          fi
