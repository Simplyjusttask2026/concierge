name: CallCenter Nextdoor Apply - manual only
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Call Center + Nextdoor patch
        run: python scripts/callcenter_nextdoor_patch.py
      - name: Compile check
        run: python -m py_compile concierge.py scripts/nextdoor_watcher.py
      - name: Watcher smoke test
        run: |
          echo '[{"text":"Looking for recommendations for a landscaper in Apopka to mow and trim my yard","author_first":"Test","age_min":60,"job":"lawn care"},{"text":"Found dog lost pet please share","author_first":"X","age_min":10,"job":"pet"}]' > /tmp/sample.json
          python scripts/nextdoor_watcher.py /tmp/sample.json
      - name: Commit back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concierge.py scripts/nextdoor_watcher.py scripts/callcenter_nextdoor_patch.py .github/workflows/callcenter-nextdoor-apply.yml
          if git diff --cached --quiet; then
            echo "No changes to commit (already patched)."
          else
            git commit -m "Call Center v1: 8-21ET gate, human call list, STOP; Nextdoor watcher CLI v1 draft-only"
            git push origin main
          fi
