name: CallCenter Nextdoor Apply - manual only
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Call Center + Nextdoor patch
        run: python scripts/callcenter_nextdoor_patch.py
      - name: Compile check
        run: python -m py_compile concierge.py scripts/nextdoor_watcher.py
      - name: Watcher smoke test
        run: |
          python scripts/nextdoor_watcher.py --selftest
          echo '[{"author":"Test Neighbor","text":"Looking for recommendations for a landscaper in Apopka, need mowing help","age_min":30},{"author":"Fake Two","text":"Lost dog please share","age_min":30}]' > /tmp/sample.json
          python scripts/nextdoor_watcher.py --input /tmp/sample.json
      - name: Commit back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concierge.py scripts/nextdoor_watcher.py scripts/callcenter_nextdoor_patch.py .github/workflows/callcenter-nextdoor-apply.yml
          if git diff --cached --quiet; then
            echo "No changes to commit (already patched)."
          else
            git commit -m "Call Center v2: 8-21ET email gate, STOP suppression, human call list in report"
            git push origin main
          fi
