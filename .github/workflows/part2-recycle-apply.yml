name: Part2 Recycle Pool - manual only
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Part2 recycle patch
        run: python scripts/part2_recycle_patch.py
      - name: Commit back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concierge.py
          if git diff --cached --quiet; then
            echo "No changes to commit (already patched)."
          else
            git commit -m "Frankenstein Part2: recycle pool + CrewAI source + Appointment Set booking sync"
            git push origin main
          fi
