name: Nextdoor offline self-test - not live
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  offline-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/nextdoor_watcher.py --selftest
      - run: echo 'Logic test only. No live feed scan or outreach. Dell validation required.'
