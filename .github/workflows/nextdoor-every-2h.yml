name: Nextdoor Every 2 Hours - draft check
on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  nextdoor-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/nextdoor_watcher.py --selftest
      - name: Summary
        run: |
          echo '## Nextdoor draft check' >> $GITHUB_STEP_SUMMARY
          echo 'Watcher self-test passed. Sends made: 0 (draft-only).' >> $GITHUB_STEP_SUMMARY
          echo 'Live hunt = Kernel profile nextdoor-anthony-personal in chat/agent, every 2h 7am-10pm ET, owner go per comment.' >> $GITHUB_STEP_SUMMARY
