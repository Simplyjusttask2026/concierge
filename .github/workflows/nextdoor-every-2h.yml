name: Nextdoor logic tests - NOT a live hunt
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  logic_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/nextdoor_watcher.py --selftest
      - run: echo 'Logic test only. No live feed read, job hunt, message or post. Live monitoring needs a validated Dell session.' >> "$GITHUB_STEP_SUMMARY"
