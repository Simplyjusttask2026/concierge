name: Nextdoor SELF-TEST ONLY - NOT a live hunt
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  selftest-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/nextdoor_watcher.py --selftest
      - run: echo 'No Nextdoor login, scan, post, comment or DM occurred. Live Dell setup remains required.'
