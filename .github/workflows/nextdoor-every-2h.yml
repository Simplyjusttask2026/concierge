name: Nextdoor offline self-test - NOT a live hunt
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  offline-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/nextdoor_watcher.py --selftest
      - run: echo 'Offline watcher logic only. No live Nextdoor scan, post, comment or DM. Dell validation remains required.'
