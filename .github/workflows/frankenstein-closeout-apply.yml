name: Frankenstein Closeout Apply - manual only
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Frankenstein closeout patch
        run: python scripts/frankenstein_closeout_patch.py
      - name: Compile check
        run: python -m py_compile concierge.py
      - name: Commit back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concierge.py scripts/frankenstein_closeout_patch.py .github/workflows/frankenstein-closeout-apply.yml
          if git diff --cached --quiet; then
            echo "No changes to commit (already patched)."
          else
            git commit -m "Frankenstein closeout: WhatsApp drafts + recycle candidates in daily report (draft-only)"
            git push origin main
          fi
