name: SJT Concierge Timers

# Runs the brain's scheduled jobs automatically - no human needed.
# Cron times are UTC: 13:00 UTC = 9:00 AM Eastern.

on:
  schedule:
    - cron: "0 13 * * *"   # 9:00 AM Eu - daily lead pipeline + Cal sync
    - cron: "0 15 * * *"   # 11:00 AM ET - social media crew
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger daily lead pipeline
        run: |
          curl -s -m 120 -X POST "${{ secrets.CONCIERGE_URL }}/run-daily" \
            -H "x-machine-token: ${{ secrets.MACHINE_TOKEN }}" || true
      - name: Sync Cal bookings to Zoho
        run: |
          curl -s -m 120 -X POST "${ secrets.CONCIERGE_URL }}/sync-cal-bookings" \
            -H "x-machine-token: ${{ secrets.MACHINE_TOKEN }}" || true

  social:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 15 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger social media crew
        run: |
          curl -s -m 170 -X POST "${{ secrets.CONCIERGE_URL }}/run-social" \
            -H "x-machine-token: ${{ secrets.MACHINE_TOKEN }}" || true
