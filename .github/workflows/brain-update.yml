name: BRAIN Update - approved shared-business append
run-name: Shared business brain append - feature branch only
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: approved-shared-business-brain-append
  cancel-in-progress: false
jobs:
  append-approved-brain:
    if: github.ref == 'refs/heads/feature/shared-business-brain'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-business-brain
          fetch-depth: 1
      - name: Offline shared-knowledge tests only
        run: python3 -m unittest discover -s tests -p test_shared_knowledge.py -v
      - name: Append approved entry and restore original workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAPPEND'
          import base64, hashlib, os
          from pathlib import Path
          assert os.environ['GITHUB_REF'] == 'refs/heads/feature/shared-business-brain', 'Wrong branch'
          p = Path('BRAIN.md')
          before = p.read_bytes()
          expected_original = '9052450f934cbe1e58cf85f5953e07378b556562'
          def blob_hash(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert len(before) >= 134750 and blob_hash(before[:134750]) == expected_original, 'Original brain history changed; stop'
          note = base64.b64decode('')
          if note not in before:
              assert blob_hash(before) == expected_original, 'Concurrent brain update; stop rather than overwrite'
              after = before + note
              assert after.startswith(before)
              p.write_bytes(after)
          else:
              print('Exact dated entry already present; no duplicate append')
          Path('.github/workflows/brain-update.yml').write_bytes(base64.b64decode(''))
          print('History preserved, approved shared-brain entry appended, original workflow restored')
          PYAPPEND
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- BRAIN.md .github/workflows/brain-update.yml
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "docs: append approved shared brain and restore manual workflow"
            git push origin HEAD:refs/heads/feature/shared-business-brain
          fi
